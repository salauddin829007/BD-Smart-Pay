.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.chip2{background:#ffffffee;color:#2b1947;border-radius:13px;padding:7px 2px;text-align:center;font-size:11px;font-weight:600;min-width:0}.chip2 img{width:22px;height:22px;object-fit:contain;display:block;margin:0 auto 2px}.chip2 b{display:block;font-size:11px;font-weight:700;color:#4d238c;white-space:nowrap}
.wrap{margin-top:-16px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:2px 0 12px}
.qa button,.pg button,.cc button{box-shadow:0 5px 14px #5a1fe014}
.qa button{background:#fff;border-radius:16px;padding:11px 2px 9px;font-size:12.5px;font-weight:600;color:#1f1235;display:flex;flex-direction:column;align-items:center;gap:5px}.qa img{width:36px;height:36px}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.pg button{background:#fff;border-radius:15px;padding:9px 2px 8px;font-size:11.5px;font-weight:600;color:#1f1235;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:68px;justify-content:center;line-height:1.2;text-align:center}.pg img{width:28px;height:28px}
.cc{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.cc button{background:#fff;border-radius:16px;padding:10px 8px;text-align:left;display:flex;align-items:center;gap:7px;color:#1f1235;min-width:0}.cc img{width:34px;height:34px;flex:none}.cc span{flex:1;min-width:0}.cc b{display:block;font-size:12px}.cc small{display:block;font-size:9.5px;color:#6b5a85;line-height:1.3;margin-top:2px}.cc i{color:#5b1fe0;font-style:normal;font-weight:700;flex:none}
.ofr{margin-top:12px;border-radius:18px;padding:12px;background:linear-gradient(110deg,#4b0fb0,#8a2be2);color:#fff;display:flex;align-items:center;gap:9px;box-shadow:0 10px 22px #4b0fb040}.ofr img{width:48px;height:48px;flex:none}.ofr div{flex:1;min-width:0}.ofr h4{font-size:16px;color:#ffd84a;margin:0 0 2px}.ofr p{font-size:11.5px;margin:0;opacity:.95;line-height:1.3}.ofr button{background:#ffc928;color:#4a148c;border-radius:12px;padding:8px 9px;font-weight:800;font-size:11.5px;white-space:nowrap;flex:none}
nav button.on svg{fill:none;stroke:#5921da}nav button.n_home.on svg{fill:#5921da}
nav button.on:after{content:"";display:block;height:3px;width:24px;border-radius:2px;background:#5921da;margin-top:1px}
nav button{min-width:56px}
.bk{background:none;color:#5b1fe0;font-weight:700;font-size:14px;padding:0 0 8px}
.wcd{background:linear-gradient(135deg,#4f17c9,#6c22f0);color:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 10px 22px #5a1fe040}
.wl .w{padding:9px 0}.wl .w div{font-size:14px}.wl .w small{font-size:11.5px}.wl .w b{font-size:14px}.wl .w img{width:38px;height:38px}
.bar{display:block;height:6px;border-radius:3px;background:#eadffd;margin-top:5px;overflow:hidden}.bar u{display:block;height:100%;background:linear-gradient(90deg,#6d28d9,#a855f7);text-decoration:none}
.sw{width:42px;height:24px;border-radius:12px;background:#d4c7f2;position:relative;flex:none}.sw:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}.sw.on{background:#5921da}.sw.on:after{left:21px}
.ag.mc{background:#7c3aed}.ag.pr{background:#16a34a}.ag.fz{background:#6b7280}
.smb{background:#f8f5ff;border-radius:12px;padding:8px 12px;margin-top:10px}.sm1{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:#4a3a6b}.sm1.t{border-top:1px dashed #d9ccff;margin-top:4px;padding-top:6px;font-weight:700;color:#1f1235}
.warn{color:#d93025;font-size:12.5px;font-weight:600;margin-top:6px}.sug{background:#e8f7ee;color:#14633a;border-radius:10px;padding:7px 10px;margin-top:8px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.sug button{background:#1f8a3b;color:#fff;border-radius:8px;padding:5px 10px;font-weight:700;font-size:12px}

/* ---- Phase 2 ---- */
.hs{display:flex;gap:8px;margin:6px 0 8px}.hs input{flex:1;padding:10px 12px;border-radius:12px;font-size:14px}.hfb{background:#fff;border:1.5px solid #e6dcf7;border-radius:12px;padding:0 12px;font-weight:700;color:#5921da;font-size:13px}
.tch{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;touch-action:pan-x pan-y;scrollbar-width:none}.tch::-webkit-scrollbar{display:none}
.tch button{flex:none;padding:6px 12px;border-radius:14px;background:#fff;border:1.5px solid #e6dcf7;font-size:12px;font-weight:600;color:#6b5a85}.tch button.on{background:#5921da;border-color:#5921da;color:#fff}
.hsum{font-size:12px;color:#7c6a99;margin:2px 2px 8px}.tr{cursor:pointer}.tr>div{min-width:0}
.st{font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px;font-style:normal}.st.success{background:#d6f5e2;color:#14633a}.st.pending{background:#fff0cf;color:#9a5b00}.st.failed{background:#fcd5d2;color:#b3261e}
.mut{color:#9a8fb0;font-weight:700;text-decoration:line-through}
.rcpt{text-align:center;margin-bottom:8px}.rci{width:54px;height:54px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-size:26px;color:#fff}.rci.success{background:#16a34a}.rci.pending{background:#f59e0b}.rci.failed{background:#d93025}
.ramt{display:block;font-size:26px;margin:2px 0 4px}.ramt.pos{color:#16a34a}
.rcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.rc{background:#f1e9ff;color:#4a1fb8;border-radius:12px;padding:5px 10px;font-size:12px;font-weight:600}.rc.fv{background:#fff4d6;color:#8a5a00}.rc.add{background:none;border:1.5px dashed #b79cf5;color:#5b1fe0}
.chart{background:#fff;border-radius:18px;padding:12px;margin:10px 0;box-shadow:0 8px 20px #5a1fe018}.leg{display:flex;gap:12px;font-size:11px;color:#6b5a85;margin-top:4px}
.rm{background:none;color:#d93025;font-size:18px;font-weight:700;padding:0 6px}
.row{gap:12px}.row b{text-align:right;max-width:68%;word-break:break-word}

const LIMIT=50000,PEND=15000;

function settle(quiet){let c=false;if(!S||!S.tx)return false;S.tx.forEach(t=>{if(t.st==='pending'&&Date.now()-t.ts>=PEND){const ac=acc(t.ac);if(ac&&!ac.frozen){ac.bal=r2(ac.bal+t.a);t.st='success';if(!quiet)toast('Bank transfer completed')}else{t.st='failed';t.why=ac?'Account is frozen.':'Account was removed.'}c=true}});if(c)save();return c}
function failTx(k,ac,nm,a,ch,why,x){log(nm,a,k==='add'?1:0,Object.assign({k,ac:ac.id,ch,st:'failed',why},x||{}));save()}
function go2(k,ok){const v={};A[k].f.forEach(([id])=>v[id]=$('#f_'+id).value);const a=+v.amt,e=m=>$('#err').textContent=m;
 if(!ok)return e('Wrong transaction PIN.');
 if(!(a>0))return e('Enter an amount greater than 0.');
 const big='Amount is above the demo limit of ৳ '+fmt(LIMIT)+' per transaction.';let t;
 if(k==='add'){const ac=acc(v.to);if(!ac)return e('Choose an account.');if(ac.frozen)return e('This account is frozen.');
  const nm='Add Money via '+v.src+' to '+lab(ac);
  if(a>LIMIT){failTx(k,ac,nm,a,0,big,{via:v.src});return e(big)}
  if(v.src==='Bank Transfer'){t=log(nm,a,1,{k,ac:ac.id,st:'pending',via:v.src});setTimeout(()=>{if(settle()&&authed)render()},PEND+500)}
  else{ac.bal=r2(ac.bal+a);t=log(nm,a,1,{k,ac:ac.id,via:v.src})}}
 else{const ac=acc(v.from);if(!ac)return e('Choose an account.');if(ac.frozen)return e('This account is frozen.');
  const ch=chg(k,ac,a),nm=A[k].t+' · '+(v.op||'')+(v.pt?' '+v.pt:'')+' '+(v.to||'')+' ('+lab(ac)+')',x={to:v.to,op:v.op,pt:v.pt};
  if(a>LIMIT){failTx(k,ac,nm,a,ch,big,x);return e(big)}
  if(ac.bal<a+ch){const m='Not enough balance in '+lab(ac)+' (needs ৳ '+fmt(a+ch)+' including charge).';failTx(k,ac,nm,a,ch,m,x);return e(m)}
  ac.bal=r2(ac.bal-a-ch);t=log(nm,a,0,Object.assign({k,ac:ac.id,ch},x))}
 save();closeSheet();render();txInfo(t.id,true)}

async function signIn(){const p=$('#ph').value.trim(),n=$('#pn').value;
 if(!phoneOk(p))return lerr('Enter a valid 11-digit mobile number.');
 if(!/^\d{4}$/.test(n))return lerr('Enter your 4-digit PIN.');
 lerr('Please wait...');const h=await sha(p+':'+n),r=await rpc('app_login',{p_phone:p,p_hash:h});
 if(!r.ok)return lerr(emsg(r)||'Mobile number or PIN is wrong.');
 cur=p;hs=h;me=r.name;S=(r.data&&Object.keys(r.data).length)?r.data:fresh();S.cards=S.cards||[];S.tx=S.tx||[];fixData();try{localStorage.setItem('bsp_ph',p)}catch(e){}authed=true;tab='home';shown=false;render();loadNB()}
async function signUp(){const nm=$('#nm').value.trim(),p=$('#ph').value.trim(),a=$('#pn').value,c=$('#pc').value;
 if(nm.length<2)return lerr('Enter your full name.');
 if(!phoneOk(p))return lerr('Enter a valid 11-digit mobile number.');
 if(!/^\d{4}$/.test(a))return lerr('PIN must be exactly 4 digits.');
 if(a!==c)return lerr('Login PINs do not match.');
 const tp=$('#tp').value,tc=$('#tc').value;
 if(!/^\d{4}$/.test(tp))return lerr('Transaction PIN must be exactly 4 digits.');
 if(tp!==tc)return lerr('Transaction PINs do not match.');
 if(tp===a)return lerr('Transaction PIN must be different from the login PIN.');
 lerr('Please wait...');const h=await sha(p+':'+a),d=fresh();d.th=await sha(p+':t:'+tp);const r=await rpc('app_register',{p_phone:p,p_name:nm,p_hash:h,p_data:d});
 if(!r.ok)return lerr(r.error==='exists'?'This number is already registered. Please sign in.':emsg(r)||'Could not create account. Try again.');
 cur=p;hs=h;me=nm;S=d;try{localStorage.setItem('bsp_ph',p)}catch(e){}authed=true;tab='home';shown=false;render();loadNB();toast('Account created')}

function qrSvg(){let s=7+(+String(cur).slice(-4)||0),h='<rect width="29" height="29" fill="#fff"/>';const F=(x,y)=>'<path fill="#1f1235" d="M'+x+' '+y+'h7v7h-7z"/><path fill="#fff" d="M'+(x+1)+' '+(y+1)+'h5v5h-5z"/><path fill="#1f1235" d="M'+(x+2)+' '+(y+2)+'h3v3h-3z"/>';
 for(let y=0;y<29;y++)for(let x=0;x<29;x++){if((x<8&&y<8)||(x>20&&y<8)||(x<8&&y>20))continue;s=(s*9301+49297)%233280;if(s/233280>.5)h+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="#1f1235"/>'}
 return h+F(0,0)+F(22,0)+F(0,22)}

 const r=new FileReader();r.onerror=()=>toast('Could not read that image.');
 r.onload=()=>{const im=new Image();im.onerror=()=>toast('Could not read that image.');
  im.onload=()=>{const c=document.createElement('canvas'),n=256;c.width=c.height=n;const x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,n,n);S.photo=c.toDataURL('image/jpeg',0.82);inp.value='';save();render();toast('Photo updated')};

 '<button class="lkb" onclick="linkAccount()">＋ Add new account</button><div class="bd"><div class="w" onclick="nav(\'cards\')"><div>Cards<small>'+S.cards.length+' card'+(S.cards.length===1?'':'s')+' · debit and credit</small></div><span style="color:#8b8499">›</span></div><div class="w" onclick="autoTog()"><div>Auto-select lowest charge<small>Pick the cheapest account for each payment</small></div><i class="sw'+(S.auto?' on':'')+'"></i></div></div></div>'}
const KT={send:['Send Money','#2f8ff0'],out:['Cash Out','#f59e0b'],add:['Cash In','#16a34a'],rech:['Recharge','#6d28d9'],bill:['Bill Pay','#e11d48'],util:['Utility','#0ea5a4'],game:['Top Up','#7c3aed'],qr:['QR Payment','#0891b2'],other:['Other','#6b7280']};
const tk=t=>t.k||(/^Add Money/.test(t.n)?'add':/^Send Money/.test(t.n)?'send':/^Cash Out/.test(t.n)?'out':/^Mobile Recharge/.test(t.n)?'rech':/^Bill Pay/.test(t.n)?'bill':/^Utility/.test(t.n)?'util':/^Top Up/.test(t.n)?'game':/^Bangla QR/.test(t.n)?'qr':'other');
const cap=x=>x.charAt(0).toUpperCase()+x.slice(1);
const p2=n=>String(n).padStart(2,'0');
const dts=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())};
const TYPES=[['all','All'],['send','Send'],['out','Cash Out'],['add','Cash In'],['rech','Recharge'],['bills','Bills'],['qr','QR'],['game','Top Up']];
let HF={q:'',type:'all',st:'all',ac:'all',range:'all',from:'',to:''};
function hrange(){const n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
 if(HF.range==='today')return[d0,Infinity];if(HF.range==='7')return[d0-6*864e5,Infinity];if(HF.range==='30')return[d0-29*864e5,Infinity];if(HF.range==='month')return[new Date(n.getFullYear(),n.getMonth(),1).getTime(),Infinity];
 if(HF.range==='custom'){return[HF.from?new Date(HF.from+'T00:00:00').getTime():-Infinity,HF.to?new Date(HF.to+'T23:59:59').getTime():Infinity]}return[-Infinity,Infinity]}
function hfilter(){const[r0,r1]=hrange(),q=HF.q.trim().toLowerCase();return S.tx.filter(t=>{const ts=t.ts||0;if(ts<r0||ts>r1)return false;const k=tk(t);
 if(HF.type!=='all'&&!(HF.type==='bills'?(k==='bill'||k==='util'):k===HF.type))return false;if(HF.st!=='all'&&(t.st||'success')!==HF.st)return false;if(HF.ac!=='all'&&t.ac!==HF.ac)return false;
 if(txf==='in'&&!t.i)return false;if(txf==='out'&&t.i)return false;if(q&&!(t.n+' '+(t.id||'')+' '+(t.to||'')+' '+t.a).toLowerCase().includes(q))return false;return true})}
const okTx=t=>(t.st||'success')==='success';
function hlist(){const l=hfilter(),inn=l.filter(t=>t.i&&okTx(t)).reduce((a,t)=>a+t.a,0),out=l.filter(t=>!t.i&&okTx(t)).reduce((a,t)=>a+t.a+(t.ch||0),0);
 return '<div class="hsum">'+l.length+' transaction'+(l.length===1?'':'s')+' · In ৳ '+fmt(inn)+' · Out ৳ '+fmt(out)+'</div>'+txs(l)}

 const head=fresh?(st==='success'?'Transaction successful':st==='pending'?'Transaction pending':'Transaction failed'):KT[k][0];
 sheet('<div class="rcpt"><div class="rci '+st+'">'+(st==='success'?'✓':st==='pending'?'⏱':'✕')+'</div><h2>'+head+'</h2><b class="ramt'+(t.i&&st==='success'?' pos':'')+'">'+(t.i?'+':'−')+'৳ '+fmt(t.a)+'</b><span class="st '+st+'">'+cap(st)+'</span></div>'+
 R('Type',KT[k][0])+R('Description',esc(t.n))+(t.to&&k!=='add'?R(k==='send'||k==='out'?'To':'Number / account',esc(t.to)):'')+(t.op?R('Operator / biller',esc(t.op)):'')+R('Account',ac?esc(lab(ac)):'Removed account')+R('Charge (demo)','৳ '+fmt(t.ch||0))+(!t.i?R('Total debited','৳ '+fmt(t.a+(t.ch||0))):'')+R('Date &amp; time',esc(new Date(t.ts).toLocaleString('en-GB')))+R('Transaction ID',esc(t.id))+(t.why?R('Reason',esc(t.why)):'')+

 const objs=[],kids=[];objs[0]='<< /Type /Catalog /Pages 2 0 R >>';objs[2]='<< /Type /Font /Subtype /Type1 /BaseFont /Courier >>';
 pages.forEach((pl,pi)=>{const pid=4+pi*2,cid=5+pi*2;kids.push(pid+' 0 R');let st='BT /F1 8 Tf 9 TL 30 812 Td\n';pl.forEach(l=>{st+='('+clean(l)+') Tj T*\n'});st+='ET';

 const mx=Math.max(1,...days.map(d=>d.x)),P=days.map((d,i)=>[10+i*46.7,88-d.x/mx*64]),L=P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 return '<div class="bd" style="margin-top:0"><div style="font-size:13px;color:#7c6a99">Total Balance</div><b style="font-size:26px;color:#5921da" onclick="shown=!shown;render()">'+(shown?'৳ '+fmt(total()):'৳ ••••••')+' <span style="font-size:12px;font-weight:600;color:#7c6a99">'+(shown?'tap to hide':'tap to show')+'</span></b><svg viewBox="0 0 300 114" style="width:100%;margin-top:6px"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a35f5" stop-opacity=".35"/><stop offset="1" stop-color="#7a35f5" stop-opacity="0"/></linearGradient></defs><path d="'+L+' L290 100 L10 100Z" fill="url(#gr)"/><path d="'+L+'" fill="none" stroke="#7a35f5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+days.map((d,i)=>'<text x="'+P[i][0]+'" y="111" font-size="9" text-anchor="middle" fill="#8b8499">'+new Date(d.s).getDate()+'</text>').join('')+'</svg></div><div class="two"><div style="background:#4f7cf0">Income<b>৳ '+fmt(inc)+'</b></div><div style="background:#f26b6b">Expense<b>৳ '+fmt(exp)+'</b></div></div>'}
function cardsPage(){const c=S.cards;return '<h3>My Cards</h3>'+(c.length?c.map((x,i)=>'<div class="vcard" onclick="rmCard('+i+')"><span class="chip"></span><div class="num">•••• •••• •••• '+esc(x.l4)+'</div><div class="nm">'+esc(x.name)+'<br><small>'+esc(x.exp)+'</small></div><b class="visa">VISA</b></div>').join(''):'<div class="vcard"><span class="chip"></span><b class="visa">VISA</b><p style="position:absolute;left:20px;bottom:18px;font-size:13px;max-width:60%">Add a new card to your wallet for easy life</p></div>')+'<button class="go" onclick="addCard()">＋ Add card</button><p style="font-size:12px;color:#8b7aa8;text-align:center;margin-top:10px">Tap a card to remove it. Demo only.</p>'}
function addCard(){sheet('<h2>Add card</h2><label>Card number</label><input id="cn" inputmode="numeric" maxlength="19" placeholder="Any fake number"><label>Name on card</label><input id="cm"><label>Expiry (MM/YY)</label><input id="ce" maxlength="5" placeholder="MM/YY"><div class="err" id="err"></div><button class="go" onclick="saveCard()">Save card</button><p style="font-size:11px;color:#8b7aa8;margin-top:10px;text-align:center">Demo only. Do not enter a real card number. Only the last 4 digits are kept on this device.</p>')}
function saveCard(){const n=$('#cn').value.replace(/\D/g,''),m=$('#cm').value.trim(),e=$('#ce').value.trim(),r=x=>$('#err').textContent=x;
 if(n.length<12||n.length>19)return r('Enter a card number with 12 to 19 digits.');if(!m)return r('Enter the name on the card.');if(!/^\d\d\/\d\d$/.test(e))return r('Enter expiry as MM/YY.');
 S.cards.push({l4:n.slice(-4),name:m,exp:e});save();closeSheet();render();toast('Card added')}
function rmCard(i){if(confirm('Remove this card?')){S.cards.splice(i,1);save();render()}}
render();
</script></body></html>
