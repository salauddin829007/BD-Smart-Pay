name: Build BD Smart Pay Demo APK (v2, with permissions)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Check the user app files exist
        run: |
          test -f www/index.html || { echo "www/index.html not found"; exit 1; }
          test -f package.json || { echo "package.json not found"; exit 1; }
          test -f capacitor.config.json || { echo "capacitor.config.json not found"; exit 1; }

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Add Android permissions (camera, location, notifications)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          test -f "$f" || { echo "AndroidManifest.xml not found at $f"; exit 1; }
          grep -q "android.permission.CAMERA" "$f" || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' "$f"
          grep -n "uses-permission\|uses-feature" "$f"

      - name: Add the QR decoder (jsQR) to the web files
        run: |
          test -f node_modules/jsqr/dist/jsQR.js || { echo "jsqr is not installed. Upload the new package.json (it adds jsqr)."; exit 1; }
          cp node_modules/jsqr/dist/jsQR.js www/jsQR.js
          npx cap sync android

      - name: Set app icon
        run: |
          if [ -d icons ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            cp -r icons/* android/app/src/main/res/
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Show APK size
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BD-Smart-Pay-Demo-APK-v2
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
