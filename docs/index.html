<meta name="theme-color" content="#4a0ca5">
<style>
:root{--p:#6a1fd8;--p2:#8a3df0;--dk:#3b0a96;--bg:#f1ebff;--card:#fff;--ink:#25163e;--mut:#6f5f8c;--line:#e4d9f9;--soft:#f6f1ff;--ok:#16a34a;--okbg:#c9f2d6;--red:#e11d48;--org:#f59e0b;--blue:#2d8cf0;--grn:#22b14c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150b2b;--card:#201240;--ink:#f1eaff;--mut:#b3a3d4;--line:#3a2763;--soft:#2a1a50;--okbg:#14532d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150b2b;--card:#201240;--ink:#f1eaff;--mut:#b3a3d4;--line:#3a2763;--soft:#2a1a50;--okbg:#14532d;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;min-height:100vh}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.side{width:228px;flex-shrink:0;background:linear-gradient(180deg,#5b12d6,#3a0a94 70%,#2a0670);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 10px}
.logo{text-align:center;font-weight:800;font-size:16px;line-height:1.2}.logo i{display:block;height:50px;margin:0 auto 6px;color:#fff;font-style:italic;font-size:46px;line-height:50px;font-weight:900;text-shadow:-6px 3px 0 #ef2f4a,-12px 6px 0 #ffffff55}.av{overflow:hidden}.i{width:1.2em;height:1.2em;vertical-align:-.25em;fill:currentColor}.nav .i{width:19px;height:19px}.qa span{color:var(--p)}.li .i{color:var(--p)}
.me{text-align:center;margin:14px 0 10px;font-size:12px}.me .av{width:62px;height:62px;margin:0 auto 6px;border:3px solid #fff;font-size:22px}.me b{display:block;font-size:14px}.me span{opacity:.8}
.nav{display:flex;flex-direction:column;gap:2px}.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;color:#fff;text-decoration:none;font-size:13px;opacity:.92}
.nav a.on{background:linear-gradient(90deg,#9b52ff,#7326e6);font-weight:700;opacity:1;padding:12px;border-radius:14px;box-shadow:0 4px 14px #0005}.nav a:hover{background:#ffffff1c}.nav em{margin-left:auto;background:#ef2f4a;border-radius:20px;padding:1px 7px;font-size:11px;font-style:normal;font-weight:700}
.nav a span:first-child{width:20px;text-align:center}

 const rows=Object.entries(M).map(([k,m])=>({k,n:m.n,i:m.i,o:m.o,us:m.u.size})).sort((a,b)=>(b.i+b.o)-(a.i+a.o)),mx=Math.max(1,...rows.map(r=>r.i+r.o));
 const cp=(k,l)=>`<button class="chip${RLP===k?' on':''}" onclick="RLP='${k}';view()">${l}</button>`,cg=(k,l)=>`<button class="chip${RLG===k?' on':''}" onclick="RLG='${k}';view()">${l}</button>`;
 return head('Location Report','Money in and out of all users, grouped by area')+`<section class="panel"><div class="ph">📍 Transactions by area</div><div class="chips">${cp('day','Today')}${cp('week','7 days')}${cp('month','This month')}${cp('year','This year')}${cp('all','All time')}</div><div class="chips" style="padding-top:0">${cg('division','Division')}${cg('district','District')}${cg('upazila','Upazila')}</div><div class="tw"><table><tr><th>Area</th><th>Users</th><th>Transactions</th><th>Money In</th><th>Money Out</th><th></th></tr>${rows.length?rows.map(r=>`<tr><td>${esc(r.k)}</td><td>${r.us}</td><td>${r.n}</td><td class="pos">৳ ${fmt(r.i)}</td><td class="neg">৳ ${fmt(r.o)}</td><td style="min-width:120px"><i class="bar" style="display:block;height:8px;border-radius:6px;background:var(--line);overflow:hidden"><u style="display:block;height:100%;width:${Math.max(2,Math.round((r.i+r.o)/mx*100))}%;background:var(--p)"></u></i></td></tr>`).join(''):'<tr><td colspan="6">No transactions in this period.</td></tr>'}</table></div><div class="li sm" style="display:block">Area comes from the location saved on each transaction by the app; if it is missing, the user's current location is used.</div></section>`}
function repP(){const t=(k,l)=>`<button class="chip${RT===k?' on':''}" onclick="RT='${k}';view()">${l}</button>`;return `<div class="chips" style="padding:0 0 10px">${t('lim','Limits')}${t('loc','By location')}</div>`+(RT==='loc'?repLoc():repLim())}
