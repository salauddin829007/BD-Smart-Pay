<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BD Smart Pay Admin</title>
<style>
*{box-sizing:border-box;margin:0}body{font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:#f6f1ff;color:#1f1235}
button{font:inherit;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;background:#5921da;color:#fff;font-weight:600}
button.g{background:#e9e0fb;color:#5921da}button.r{background:#d93025}button.o{background:#1f8a3b}
input,select,textarea{font:inherit;padding:10px;border:1.5px solid #ddd0f5;border-radius:10px;width:100%}
.top{background:#5921da;color:#fff;padding:14px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.tw{overflow-x:auto;border-radius:14px}.top h1{font-size:20px;flex:1}
.wrap{max-width:1100px;margin:20px auto;padding:0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.c{background:#fff;border-radius:14px;padding:14px}.c b{display:block;font-size:26px;color:#5921da}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;font-size:14px;border-bottom:1px solid #eee}th{background:#ede4ff}
.tag{padding:2px 9px;border-radius:10px;font-size:12px;font-weight:700}.ok{background:#c0f7d8;color:#1f8a3b}.bad{background:#fcd5d2;color:#d93025}
.login{max-width:360px;margin:90px auto;background:#fff;border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:12px}
.err{color:#d93025;font-size:13px;min-height:16px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px}.modal.on{display:flex}
.box{background:#fff;border-radius:18px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:14px;gap:10px}
.pos{color:#1f8a3b}.neg{color:#d93025}.sm{font-size:12px;color:#7c6a99}
</style></head><body>
<div id="app"></div><div class="modal" id="m"><div class="box" id="mb"></div></div>
<script>
const SB='https://xtxpazrfqvwmqdssxqfs.supabase.co',KEY='sb_publishable_PhWXVKtt-m2sYMuSjlWWPQ_EhbwAQ6d';
const $=s=>document.querySelector(s);
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const fmt=n=>Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
let TOKEN=null;try{TOKEN=sessionStorage.getItem('t')}catch(e){}
let tab='users',U=[],Q=[],N=[],ADM=null,LAST=null;
function out(){TOKEN=null;try{sessionStorage.removeItem('t')}catch(e){}login()}
// SHA-256 (same hash as the app). Uses the browser's crypto when available, plain JS otherwise.
function sha256js(m){const K=[];let p=2;while(K.length<64){let ok=1;for(let i=2;i*i<=p;i++)if(p%i==0){ok=0;break}if(ok)K.push(Math.floor((Math.cbrt(p)%1)*4294967296)>>>0);p++}
 let H=[];p=2;while(H.length<8){let ok=1;for(let i=2;i*i<=p;i++)if(p%i==0){ok=0;break}if(ok)H.push(Math.floor((Math.sqrt(p)%1)*4294967296)>>>0);p++}
 const b=[...new TextEncoder().encode(m)],l=b.length*8;b.push(0x80);while(b.length%64!==56)b.push(0);for(let i=7;i>=0;i--)b.push(i>3?0:(l>>>(i*8))&255);
 const r=(x,n)=>(x>>>n)|(x<<(32-n));
 for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=(b[o+4*i]<<24|b[o+4*i+1]<<16|b[o+4*i+2]<<8|b[o+4*i+3])>>>0;
  for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0}
  let[a,bb,c,d,e,f,g,h]=H;
  for(let i=0;i<64;i++){const S1=r(e,6)^r(e,11)^r(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])>>>0,S0=r(a,2)^r(a,13)^r(a,22),mj=(a&bb)^(a&c)^(bb&c),t2=(S0+mj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=bb;bb=a;a=(t1+t2)>>>0}
  H=[H[0]+a,H[1]+bb,H[2]+c,H[3]+d,H[4]+e,H[5]+f,H[6]+g,H[7]+h].map(x=>x>>>0)}
 return H.map(x=>x.toString(16).padStart(8,'0')).join('')}
async function sha(t){try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}return sha256js(t)}
const fx=(u,o)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);return fetch(u,{...o,signal:c.signal}).finally(()=>clearTimeout(t))};
async function api(path,opt={}){const h={apikey:KEY,'Content-Type':'application/json',Authorization:'Bearer '+TOKEN,...(opt.headers||{})};
 const r=await fx(SB+path,{...opt,headers:h});if(r.status===401){out();login('Session expired. Please sign in again.');throw new Error('401')}
 if(!r.ok){const t=await r.text();throw new Error(t||r.status)}const t=await r.text();return t?JSON.parse(t):null}
function login(msg){$('#app').innerHTML='<div class="login"><h2>BD Smart Pay Admin</h2><input id="em" type="email" placeholder="Admin email"><input id="pw" type="password" placeholder="Password"><div class="err" id="le">'+esc(msg||'')+'</div><button onclick="doLogin()">Sign in</button></div>'}
async function doLogin(){const e=$('#le');e.textContent='Please wait...';
 try{const r=await fx(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value.trim(),password:$('#pw').value})});
  const j=await r.json();if(!r.ok||!j.access_token){e.textContent='Sign in failed: '+(j.msg||j.error_description||j.message||j.error||r.status);return}TOKEN=j.access_token;try{sessionStorage.setItem('t',TOKEN)}catch(e){}e.textContent='Loading data...';await load()}catch(x){e.textContent=x.name==='AbortError'?'Timed out: the server did not answer in 20 seconds. Check internet or VPN.':'Could not connect: '+x.message}}
async function load(){try{[U,Q,N]=await Promise.all([api('/rest/v1/app_users?select=phone,name,blocked,failed,created_at,updated_at,data&order=created_at.desc'),api('/rest/v1/pin_requests?select=*&order=created_at.desc&limit=200'),api('/rest/v1/notices?select=*&order=created_at.desc&limit=50')]);
 if(!Array.isArray(U)){login('You are not an admin.');return}
 try{ADM=await api('/rest/v1/rpc/is_admin',{method:'POST',body:'{}'})}catch(e){ADM=null}LAST=new Date();view()}catch(x){if(TOKEN){out();login(x.name==='AbortError'?'Timed out while loading data. Try again.':'Could not load data: '+x.message)}}}
const bal=u=>u.data&&u.data.w?Object.values(u.data.w).reduce((a,b)=>a+b,0):0;
const dt=t=>t?new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
const nameOf=p=>{const u=U.find(x=>x.phone===p);return u?u.name:''};
function view(){const pend=Q.filter(q=>!q.done);
 let m='';
 if(tab==='users')m='<div class="tw"><table><tr><th>Name</th><th>Mobile</th><th>Balance</th><th>Status</th><th>Registered</th><th></th></tr>'+(U.length?U.map(u=>'<tr><td>'+esc(u.name)+'</td><td>'+esc(u.phone)+'</td><td>৳ '+fmt(bal(u))+'</td><td><span class="tag '+(u.blocked?'bad':'ok')+'">'+(u.blocked?'Locked':'Active')+'</span></td><td>'+dt(u.created_at)+'</td><td><button class="g" onclick="detail(\''+esc(u.phone)+'\')">Open</button></td></tr>').join(''):'<tr><td colspan="6">No users yet.</td></tr>')+'</table></div>';
 if(tab==='req')m='<div class="tw"><table><tr><th>Mobile</th><th>Name</th><th>Requested</th><th>Status</th><th></th></tr>'+(Q.length?Q.map(q=>'<tr><td>'+esc(q.phone)+'</td><td>'+esc(nameOf(q.phone))+'</td><td>'+dt(q.created_at)+'</td><td>'+(q.done?'<span class="tag ok">Done</span>':'<span class="tag bad">Pending</span>')+'</td><td>'+(q.done?'':'<button onclick="setPin(\''+esc(q.phone)+'\','+q.id+')">Reset PIN</button>')+'</td></tr>').join(''):'<tr><td colspan="5">No requests.</td></tr>')+'</table></div>';
 if(tab==='not')m='<div class="c" style="margin-bottom:14px"><b style="font-size:16px;margin-bottom:8px">New notice (shown in the app bell)</b><input id="nt" placeholder="Title" maxlength="80" style="margin-bottom:8px"><textarea id="nb" rows="2" placeholder="Message" maxlength="300" style="margin-bottom:8px"></textarea><button onclick="addNotice()">Send notice</button></div><div class="tw"><table><tr><th>Title</th><th>Message</th><th>Date</th><th></th></tr>'+(N.length?N.map(n=>'<tr><td>'+esc(n.title)+'</td><td>'+esc(n.body)+'</td><td>'+dt(n.created_at)+'</td><td><button class="r" onclick="delNotice('+n.id+')">Delete</button></td></tr>').join(''):'<tr><td colspan="4">No notices.</td></tr>')+'</table></div>';
 $('#app').innerHTML='<div class="top"><h1>BD Smart Pay Admin</h1><button class="g" onclick="load()">Refresh</button><button class="g" onclick="out()">Sign out</button></div><div class="wrap"><div class="cards"><div class="c">Users<b>'+U.length+'</b></div><div class="c">Locked accounts<b>'+U.filter(u=>u.blocked).length+'</b></div><div class="c">PIN requests pending<b>'+pend.length+'</b></div><div class="c">Total demo balance<b>৳ '+fmt(U.reduce((a,u)=>a+bal(u),0))+'</b></div></div><div class="tabs"><button class="'+(tab==='users'?'':'g')+'" onclick="tab=\'users\';view()">Users</button><button class="'+(tab==='req'?'':'g')+'" onclick="tab=\'req\';view()">PIN requests ('+pend.length+')</button><button class="'+(tab==='not'?'':'g')+'" onclick="tab=\'not\';view()">Notices</button></div>'+'<p class="sm" style="margin-bottom:10px">Last updated: '+(LAST?LAST.toLocaleTimeString():'-')+' · Admin check: '+(ADM===true?'<b style="color:#1f8a3b">OK, you are an admin</b>':ADM===false?'<b style="color:#d93025">NOT recognised as admin. The email in the admins table does not match your login email, so lists show empty.</b>':'unknown')+'</p>'+m+'<p class="sm" style="margin-top:12px">All money in this app is demo money. Balances are not real.</p></div>'}
function modal(h){$('#mb').innerHTML=h;$('#m').classList.add('on')}
function closeM(){$('#m').classList.remove('on')}
$('#m').onclick=e=>{if(e.target.id==='m')closeM()};
function detail(p){const u=U.find(x=>x.phone===p);if(!u)return;const d=u.data||{},w=d.w||{},tx=d.tx||[];
 modal('<h2>'+esc(u.name)+'</h2><p class="sm">'+esc(u.phone)+' · registered '+dt(u.created_at)+' · last saved '+dt(u.updated_at)+'</p><p style="margin:8px 0"><span class="tag '+(u.blocked?'bad':'ok')+'">'+(u.blocked?'Locked':'Active')+'</span> <span class="sm">failed PIN attempts: '+u.failed+'</span></p>'+
 '<h3 style="margin:10px 0 4px">Wallets (demo)</h3>'+Object.keys(w).map(k=>'<div class="row"><span>'+esc(k)+'</span><b>৳ '+fmt(w[k])+'</b></div>').join('')+'<div class="row"><b>Total</b><b>৳ '+fmt(bal(u))+'</b></div>'+
 '<h3 style="margin:12px 0 4px">Transactions ('+tx.length+')</h3>'+(tx.length?tx.slice(0,50).map(t=>'<div class="row"><span>'+esc(t.n)+'<br><span class="sm">'+dt(t.ts)+'</span></span><b class="'+(t.i?'pos':'neg')+'">'+(t.i?'+':'−')+'৳ '+fmt(t.a)+'</b></div>').join(''):'<p class="sm">None.</p>')+
 '<div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="'+(u.blocked?'o':'r')+'" onclick="toggle(\''+esc(u.phone)+'\','+(!u.blocked)+')">'+(u.blocked?'Unlock account':'Lock account')+'</button><button onclick="setPin(\''+esc(u.phone)+'\')">Set new PIN</button><button class="r" onclick="delUser(\''+esc(u.phone)+'\')">Delete account</button><button class="g" onclick="closeM()">Close</button></div>')}
const ph=p=>encodeURIComponent(p);
async function toggle(p,b){try{await api('/rest/v1/app_users?phone=eq.'+ph(p),{method:'PATCH',body:JSON.stringify(b?{blocked:true}:{blocked:false,failed:0}),headers:{Prefer:'return=minimal'}});closeM();await load()}catch(e){alert('Failed: '+e.message)}}
async function setPin(p,rid){const n=prompt('Enter a new 4-digit PIN for '+p+' (tell it to the user):');if(n===null)return;if(!/^\d{4}$/.test(n))return alert('PIN must be exactly 4 digits.');
 try{await api('/rest/v1/app_users?phone=eq.'+ph(p),{method:'PATCH',body:JSON.stringify({pin_hash:await sha(p+':'+n),blocked:false,failed:0}),headers:{Prefer:'return=minimal'}});
  await api('/rest/v1/pin_requests?phone=eq.'+ph(p)+'&done=eq.false',{method:'PATCH',body:JSON.stringify({done:true}),headers:{Prefer:'return=minimal'}});closeM();await load();alert('PIN changed. Tell '+p+' the new PIN.')}catch(e){alert('Failed: '+e.message)}}
async function delUser(p){if(!confirm('Delete the account '+p+' and all its data? This cannot be undone.'))return;try{await api('/rest/v1/app_users?phone=eq.'+ph(p),{method:'DELETE',headers:{Prefer:'return=minimal'}});closeM();await load()}catch(e){alert('Failed: '+e.message)}}
async function addNotice(){const t=$('#nt').value.trim(),b=$('#nb').value.trim();if(!t)return alert('Enter a title.');try{await api('/rest/v1/notices',{method:'POST',body:JSON.stringify({title:t,body:b}),headers:{Prefer:'return=minimal'}});await load()}catch(e){alert('Failed: '+e.message)}}
async function delNotice(id){if(!confirm('Delete this notice?'))return;try{await api('/rest/v1/notices?id=eq.'+id,{method:'DELETE',headers:{Prefer:'return=minimal'}});await load()}catch(e){alert('Failed: '+e.message)}}
if(TOKEN)load();else login();
</script></body></html>
