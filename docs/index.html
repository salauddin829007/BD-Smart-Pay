var UPZ_OK=false,LD='';
async function getUsers(){const b='/rest/v1/app_users?select='+UCOLS,o='&order=created_at.desc';
 try{const r=await api(b+',division,district,upazila,village'+o);LOC_OK=true;UPZ_OK=true;return r}catch(e){UPZ_OK=false}
 try{const r=await api(b+',division,district'+o);LOC_OK=true;return r}catch(e){LOC_OK=false}
 return api(b+o)}
const opt=(a,s)=>a.map(x=>`<option${x===s?' selected':''}>${esc(x)}</option>`).join('');
function locBox(u){if(!LOC_OK)return '';const dv=u.division||'',ds=u.district||'';
 return `<div style="margin:8px 0"><b style="font-size:14px">Location</b> <span class="sm">(set by admin, not live GPS)</span><div class="chips" style="padding:6px 0"><select id="dv" onchange="fillDs()"><option value="">Division</option>${opt(Object.keys(BD),dv)}</select><select id="ds" onchange="fillUp()"><option value="">District</option>${opt(BD[dv]||[],ds)}</select>${UPZ_OK?`<select id="up"><option value="">Upazila</option>${opt(UPZ[ds]||[],u.upazila||'')}</select><input id="vl" placeholder="Village / area" maxlength="80" value="${esc(u.village||'')}" style="flex:1;min-width:140px">`:''}<button onclick="saveLoc('${esc(u.phone)}')">Save</button></div></div>`}
function fillDs(){$('#ds').innerHTML='<option value="">District</option>'+opt(BD[$('#dv').value]||[],'');fillUp()}
function fillUp(){const e=$('#up');if(e)e.innerHTML='<option value="">Upazila</option>'+opt(UPZ[$('#ds').value]||[],'')}
async function saveLoc(p){const a=$('#dv').value||null,b=$('#ds').value||null,c=UPZ_OK?($('#up').value||null):null,v=UPZ_OK?(($('#vl').value||'').trim()||null):null;
 try{await api('/rest/v1/app_users?phone=eq.'+ph(p),{method:'PATCH',body:JSON.stringify(UPZ_OK?{division:a,district:b,upazila:c,village:v}:{division:a,district:b}),headers:{Prefer:'return=minimal'}});logAct('Set location',p,[a,b,c,v].filter(Boolean).join(' / ')||'-');closeM();await load();toast('Location saved')}catch(e){alert('Failed: '+e.message)}}
async function blockLoc(lv,n,b){const nm=n.replace('|',' / ');if(!confirm((b?'Block ':'Unblock ')+nm+' ('+lv+')? '+(b?'All users in this location will be locked.':'All locked users in this location will be unlocked, including any locked for other reasons.')))return;
 try{const e=encodeURIComponent,q='/rest/v1/app_users?'+(lv==='upazila'?'district=eq.'+e(n.split('|')[0])+'&upazila=eq.'+e(n.split('|')[1]):lv+'=eq.'+e(n)),rm={Prefer:'return=minimal'};
  if(b){await api('/rest/v1/blocked_locations',{method:'POST',body:JSON.stringify({level:lv,name:n}),headers:{Prefer:'return=minimal,resolution=ignore-duplicates'}});await api(q,{method:'PATCH',body:JSON.stringify({blocked:true}),headers:rm})}
  else{await api('/rest/v1/blocked_locations?level=eq.'+lv+'&name=eq.'+e(n),{method:'DELETE',headers:rm});await api(q,{method:'PATCH',body:JSON.stringify({blocked:false,failed:0}),headers:rm})}
  logAct(b?'Block location':'Unblock location',nm,lv);await load();toast(nm+(b?' blocked':' unblocked'))}catch(x){alert('Failed: '+x.message)}}
function locP(){const h0=head('Locations','Divisions, districts and upazilas: assign users, block and unblock');if(!LOC_OK)return h0+need('Location system');
 const isB=(l,n)=>(BL||[]).some(b=>b.level===l&&b.name===n),cnt=(l,n)=>U.filter(u=>u[l]===n);
 const btn=(l,n)=>{const b=isB(l,n);return `<button class="g" data-n="${esc(n)}" onclick="viewLoc('${l}',this.dataset.n)">View users</button> <button class="${b?'g':'r'}" data-n="${esc(n)}" onclick="blockLoc('${l}',this.dataset.n,${b?0:1})">${b?'Unblock':'Block'}</button>`},st=(l,n)=>isB(l,n)?'<span class="tag bad">Blocked</span>':'<span class="tag ok">Open</span>';
 const dr=Object.keys(BD).map(d=>{const us=cnt('division',d);return `<tr><td>${d}</td><td>${BD[d].length}</td><td>${us.length}</td><td>${us.filter(u=>u.blocked).length}</td><td>${st('division',d)}</td><td>${btn('division',d)}</td></tr>`}).join('');
 const ds=LV&&BD[LV]?BD[LV].map(n=>{const us=cnt('district',n);return `<tr><td>${esc(n)}</td><td>${(UPZ[n]||[]).length}</td><td>${us.length}</td><td>${us.filter(u=>u.blocked).length}</td><td>${st('district',n)}</td><td>${btn('district',n)}</td></tr>`}).join(''):'';
 const alld=Object.values(BD).flat().sort(),nU=Object.values(UPZ).reduce((a,x)=>a+x.length,0),un=U.filter(u=>!u.division&&!u.district).length;
 const up=UPZ_OK&&LD&&UPZ[LD]?UPZ[LD].map(n=>{const k=LD+'|'+n,us=U.filter(u=>u.district===LD&&u.upazila===n);return `<tr><td>${esc(n)}</td><td>${us.length}</td><td>${us.filter(u=>u.blocked).length}</td><td>${st('upazila',k)}</td><td>${btn('upazila',k)}</td></tr>`}).join(''):'';
 return h0+(BL===null?need('Location blocking'):'')+`<section class="panel"><div class="ph">📍 Divisions (8)</div><div class="tw"><table><tr><th>Division</th><th>Districts</th><th>Users</th><th>Locked</th><th>Status</th><th></th></tr>${dr}</table></div></section><section class="panel" style="margin-top:12px"><div class="ph">📍 Districts (64)</div><div class="chips"><select onchange="LV=this.value;view()"><option value="">Select division</option>${opt(Object.keys(BD),LV)}</select><span class="sm">${un} user(s) have no location. Set it from Users, then Open.</span></div>${ds?`<div class="tw"><table><tr><th>District</th><th>Upazilas</th><th>Users</th><th>Locked</th><th>Status</th><th></th></tr>${ds}</table></div>`:'<div class="li sm">Choose a division to see its districts.</div>'}</section>`+(UPZ_OK?`<section class="panel" style="margin-top:12px"><div class="ph">📍 Upazilas (${nU})</div><div class="chips"><select onchange="LD=this.value;view()"><option value="">Select district</option>${opt(alld,LD)}</select><span class="sm">Village / area is typed per user (no complete village list exists).</span></div>${up?`<div class="tw"><table><tr><th>Upazila</th><th>Users</th><th>Locked</th><th>Status</th><th></th></tr>${up}</table></div>`:'<div class="li sm">Choose a district to see its upazilas.</div>'}</section>`:need('Upazila and village (upazila_village.sql)'))}
var SM=null,PGN={},FD='',FS='',FU='';
function viewLoc(l,n){FD=FS=FU='';SQ='';UF='all';if(l==='division')FD=n;else if(l==='district'){FS=n;FD=Object.keys(BD).find(d=>BD[d].includes(n))||''}else{const a=n.split('|');FS=a[0];FD=Object.keys(BD).find(d=>BD[d].includes(a[0]))||'';FU=a[1]}go('users')}
const PS=25;
const pgr=(k,n)=>{const pc=Math.max(1,Math.ceil(n/PS)),c=Math.min(PGN[k]||0,pc-1);PGN[k]=c;return{s:c*PS,e:c*PS+PS,html:n>PS?`<div class="chips" style="justify-content:space-between"><span class="sm">${c*PS+1}–${Math.min(n,c*PS+PS)} of ${n}</span><span><button class="chip" ${c?'':'disabled'} onclick="PGN['${k}']=${c-1};view()">‹ Prev</button> <button class="chip" ${c<pc-1?'':'disabled'} onclick="PGN['${k}']=${c+1};view()">Next ›</button></span></div>`:''}};
var FL=null;
async function loadFlags(){try{FL=await api('/rest/v1/feature_flags?select=*&order=label.asc')}catch(e){FL=null}}
async function setFlag(k,b){if(!b&&!confirm('Turn OFF this feature for all users?'))return;try{await api('/rest/v1/feature_flags?key=eq.'+encodeURIComponent(k),{method:'PATCH',body:JSON.stringify({enabled:b,updated_at:new Date().toISOString()}),headers:{Prefer:'return=minimal'}});logAct('Feature '+(b?'on':'off'),k);await loadFlags();view();toast('Feature '+(b?'enabled':'disabled'))}catch(e){alert('Failed: '+e.message)}}
function featP(){const rows=FL===null?'<div class="li sm" style="display:block;line-height:1.6">Feature table not found. Run the SQL setup in Supabase (SQL Editor) first, then tap refresh.</div>':FL.length?FL.map(f=>`<div class="li"><div><b>${esc(f.label||f.key)}</b><div class="sm">${esc(f.key)} · ${f.enabled?'Enabled':'Disabled'} for all users</div></div><div class="sw${f.enabled?' on':''}" role="switch" aria-checked="${!!f.enabled}" style="margin-left:auto" onclick="setFlag('${esc(f.key)}',${!f.enabled})"></div></div>`).join(''):'<div class="li sm">No features found.</div>';
 return head('Feature Control','Turn app features on or off for all users')+`<section class="panel"><div class="ph">🎛 Features</div>${rows}</section>`}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500)}
const typing=()=>{const a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)};
async function auto(){if(!TOKEN||document.hidden||$('#m').classList.contains('on')||typing())return;
 try{const[u,q,n]=await Promise.all([getUsers(),api('/rest/v1/pin_requests?select=*&order=created_at.desc&limit=200'),api('/rest/v1/notices?select=*&order=created_at.desc&limit=50')]);
 if(!Array.isArray(u)||typing()||$('#m').classList.contains('on'))return;const fresh=KNOWN?q.filter(x=>!x.done&&!KNOWN.has(x.id)):[];U=u;Q=q;N=n;LAST=new Date();try{SM=await api('/rest/v1/rpc/admin_summary',{method:'POST',body:'{}'})}catch(e){}view();if(fresh.length)toast('New PIN request'+(fresh.length>1?'s':'')+': '+fresh.length)}catch(e){}}
setInterval(auto,30000);
